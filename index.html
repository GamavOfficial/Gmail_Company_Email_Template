<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Company Template Builder</title>
    <!-- CSS இணைப்பு -->
    <link rel="stylesheet" href="style.css">
    <!-- Tailwind CSS (Framework) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <header class="bg-white border-b h-16 flex items-center px-6 shadow-sm">
        <span class="text-xl font-bold text-gray-700">Workspace Mail Builder</span>
    </header>

    <div class="flex h-[calc(100vh-4rem)]">
        <!-- Sidebar -->
        <aside class="w-80 bg-white border-r p-6">
            <h2 class="text-lg font-bold mb-4">Customizer</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium">Header Title</label>
                    <input type="text" id="inputTitle" value="Welcome to Our Company" class="w-full border p-2 rounded" oninput="updatePreview()">
                </div>
                <div>
                    <label class="block text-sm font-medium">Theme Color</label>
                    <input type="color" id="inputColor" value="#1a73e8" class="w-full h-10 border rounded cursor-pointer" oninput="updatePreview()">
                </div>
                <div>
                    <label class="block text-sm font-medium">Email Content</label>
                    <textarea id="inputBody" rows="4" class="w-full border p-2 rounded" oninput="updatePreview()">Hello User, your workspace is ready.</textarea>
                </div>
                <button onclick="exportTemplate()" class="w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700">Export Template</button>
            </div>
        </aside>

        <!-- Preview -->
        <main class="flex-1 p-10 flex justify-center items-start">
            <div id="previewContainer" class="bg-white w-full max-w-2xl rounded-xl shadow-lg overflow-hidden">
                <div id="previewHeader" class="bg-[#1a73e8] p-8 text-white text-center">
                    <h1 id="previewTitle" class="text-2xl font-bold">Welcome to Our Company</h1>
                </div>
                <div class="p-8">
                    <p id="previewBodyText" class="text-gray-700">Hello User, your workspace is ready.</p>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
